<style>
  /* Montserrat desde el repo, no del CDN de Google (8-ago-2026). Con la señal
     de la tienda fallando, el CDN caído dibujaba la app con la letra del
     sistema y todo se descuadraba sin avisar. Ver tablero.html. */
  @font-face{

<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  :root { --rojo:#D12026; --naranja:#F37021; --azul:#336BB4; --verde:#1a8c4e; --teal:#0e9594; --gris:#777; --linea:#ececec; --bg:#f6f6f7; }
  body { font-family:'Montserrat',sans-serif; background:var(--bg); color:#1a1a1a; padding-bottom:40px; }

  header { background:#fff; border-bottom:3px solid var(--rojo); padding:14px 16px;
    display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:30; }
  header .back { text-decoration:none; color:var(--rojo); font-size:30px; font-weight:700;
    line-height:1; padding:0 6px 4px 0; display:flex; align-items:center; }
  header img { height:34px; width:auto; }
  .h-txt h1 { font-size:15px; font-weight:800; letter-spacing:-.2px; }
  .h-txt p { font-size:11px; color:var(--gris); margin-top:1px; }
  .updated { margin-left:auto; font-size:10px; color:#aaa; text-align:right; line-height:1.3; }
  .updated b { color:var(--teal); display:block; font-size:11px; }

  main { padding:16px 16px 0; max-width:560px; margin:0 auto; }
  .nota { font-size:11.5px; color:#999; background:#fff; border:1px solid var(--linea); border-radius:10px;
    padding:10px 12px; margin-bottom:16px; line-height:1.4; }
  .nota b { color:#555; }

  .grupo-titulo { font-size:11px; font-weight:700; color:#999; text-transform:uppercase;
    letter-spacing:1px; margin:18px 4px 8px; }

  .card { background:#fff; border:1px solid var(--linea); border-left-width:4px;
    border-radius:12px; padding:14px 15px; margin-bottom:10px; border-left-color:var(--teal); }

  .card .top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .card h3 { font-size:14.5px; font-weight:700; line-height:1.3; }
  .card .puesto { font-size:11.5px; color:#999; font-weight:600; margin-top:1px; }

  .venta-row { display:flex; align-items:baseline; gap:8px; margin-top:10px; }

  .venta-lbl { font-size:10.5px; color:#aaa; font-weight:600; }
  .badge { font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; background:#f2f2f2; color:#666; }
  .badge.ok { background:#eafaf1; color:var(--verde); }
  .badge.warn { background:#fff5ee; color:var(--naranja); }
  .badge.bad { background:#fdeaea; color:var(--rojo); }
  .meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:6px; }

  .extra-head { font-size:11px; font-weight:800; color:var(--teal); text-transform:uppercase;
    letter-spacing:.4px; margin-bottom:6px; }
  .extra-grid { display:flex; align-items:center; gap:14px; }
  .extra-pct { font-size:22px; font-weight:800; }
  .extra-det { font-size:11.5px; color:#888; line-height:1.4; }
  .extra-none { font-size:12px; color:#bbb; }

  footer { text-align:center; font-size:10px; color:#ccc; margin-top:24px; padding:0 16px; }

<body>
<script src="./continuidad.js"></script>
<!-- supabase-js (15-sep-2026). Aquí NO se usa para leer datos —eso sigue yendo
     por `fetch` a la RPC— sino para una sola cosa: saber si quien abre esta
     pantalla tiene una sesión de correo y contraseña, y poder preguntarle al
     SERVIDOR si manda en esta tienda. Se lee la sesión con la biblioteca y no
     del `localStorage` a mano porque el token caduca en una hora: leerlo crudo
     daría 401 a la hora de haber entrado, y la pantalla se vería «sin datos».
     Si el CDN no responde, no pasa nada grave: se sigue sin sesión, que es el
     lado seguro — sin comisiones, no con las de todos. -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>


<header>
  <a href="index.html" class="back" title="Menú">‹</a>
  <img src="logo_odemas.png" alt="Odemás">
  <div class="h-txt">
    <h1>Comisiones y Extracoberturas</h1>
    <p id="storeSub">—</p>
  </div>
  <div class="updated">Actualizado<b id="updated">—</b></div>

<main>
  <div class="nota">📊 Datos oficiales de <b>Sonar by Office Depot</b>. <b>Venta</b> = periodo <span id="pComis">—</span>. <b>Extracobertura</b> = periodo <span id="pGar">—</span>. Se actualiza cuando el gerente comparte captura nueva del reporte.</div>

<!-- comisiones_datos.js se elimino el 1-ago-2026: este repo es publico y ese
     archivo traia nombre completo, venta individual, alcance y monto de
     comision de cada persona. Los datos vienen de la nube (modo=comisiones). -->
<script>
/* ====== Sesión de tienda: sin hes1217_store no hay datos que mostrar ====== */
const _storeConfig = (function(){ try{ return JSON.parse(localStorage.getItem('hes1217_store')||'null'); }catch(e){ return null; } })();

/* Sesión de antes del candado (1-ago-2026): no trae gas_token. Hoy el Apps
   Script todavía la deja pasar porque GAS_ESTRICTO está en false, pero en cuanto
   se cierre, CADA llamada se rechaza. Se avisa desde que abre la app, no a media
   captura, y sin sacar a nadie a la fuerza: el enlace lo decide la persona. */
(function(){
  var _c = _storeConfig;
  if(!_c || !_c.store_id || _c.gas_token) return;
  function _pintar(){
    var b = document.createElement('div');
    b.style.cssText = 'position:sticky;top:0;z-index:99;padding:11px 14px;'
      + 'background:#fdf3dc;border-bottom:2px solid #F37021;color:#7a5200;'
      + 'font-size:13px;font-weight:700;text-align:center;line-height:1.5';
    b.innerHTML = '⚠ Tu sesión es de antes y va a dejar de funcionar. '
      + '<a href="index.html" style="color:#D12026">Vuelve a entrar</a>'
      + ' — no se pierde nada de lo que tengas capturado.';
    document.body.insertBefore(b, document.body.firstChild);
  }
  if(document.readyState === 'loading') addEventListener('DOMContentLoaded', _pintar);
  else _pintar();
})();

if(!_storeConfig || !_storeConfig.store_id){
  // Se avisa a continuidad.js de que esta salida es voluntaria. Hoy el menú ya
  // no reanudaría —sin `hes1217_store` no reanuda nada—, pero eso es una casualidad
  // de dos condiciones que coinciden, y el día que una cambie esto sería un
  // bucle: comisiones → menú → comisiones.
  if(window.HES_salirAlMenu) window.HES_salirAlMenu();
  location.replace('index.html');
  throw new Error('Sin sesión de tienda — redirigiendo a login');
}
const _storeId = _storeConfig.store_id;
document.getElementById('storeSub').textContent = 'HES ' + _storeId + ' · ' + (_storeConfig.nombre || 'Odemás');
document.getElementById('footerTxt').textContent = 'Odemás · Grupo Gigante — uso interno HES ' + _storeId;

/* ====== Datos: caché local de esta tienda -> nube (GAS) -> respaldo estático embebido ====== */
const CLOUD_URL = _storeConfig.gas_url || '';
// El Apps Script exige token desde el 1-ago-2026. Sin esto la peticion se
// rechaza y la pagina se queda con el cache viejo SIN avisar.
const GAS_TOKEN = _storeConfig.gas_token || '';
const COMISKEY = 'hes' + _storeId + '_comisiones';

/* ── Quién está mirando (6-sep-2026) ──────────────────────────────────────
   Hasta hoy esta pantalla no se lo preguntaba: pintaba el equipo entero a
   quien la abriera. Ahora cada quien ve lo suyo y gerente y subgerente ven a
   todos, y quien decide es el SERVIDOR — aquí solo se dice quién eres.

   ⚠️ MISMA REGLA DE PUESTOS QUE `tablero.html` y `horarios.html`, y por tercera
   vez escrita aparte: estas cuatro pantallas no comparten ningún archivo de JS.
   Que las tres listas no se separen lo vigila `r_puestos_gestion`. */
const PUESTOS_GESTION_C = ['gerente', 'subgerente'];
function esPuestoDeGestion_(puesto){
  const p = String(puesto || '').toLowerCase()
              .normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]','g'), '').trim();
  return PUESTOS_GESTION_C.some(function(x){ return p.indexOf(x) === 0; });
}

let _yo = null;
// Ficha ilegible: se sigue sin identidad, y sin identidad esta pantalla NO
// enseña comisiones — se pide entrar con el número. Fallar hacia «no sé quién
// eres» es lo correcto aquí; lo peligroso sería caer hacia «enséñalo todo».
try{ _yo = JSON.parse(localStorage.getItem('hes1217_empleado')||'null'); }catch(e){}
const MI_EMPNO = (_yo && _yo.empno) ? String(_yo.empno) : '';

/* ⚠️ `let`, no `const`, desde el 15-sep-2026: hay una TERCERA forma de mandar
   aquí y no se sabe al arrancar, hay que preguntarla.

   Las dos que ya había van por la ficha de empleado. La tercera es el gerente
   DUEÑO de la tienda, que entra con el correo de la tienda: su cuenta vive en
   `tiendas.user_id` y no en `empleados`, así que `index.html` no le guarda
   `hes1217_empleado` (ver el `else removeItem` de doLogin) y aquí llegaba sin
   número y sin puesto — o sea, indistinguible de un desconocido. Resultado: el
   gerente veía «entra con tu número de empleado» en su propia tienda.

   Es la tercera vez que el mismo fallo sale por otro lado: la misma persona,
   dos puertas de entrada, distinto resultado (MAPA, cadenas 1 y 1-bis). El
   tablero ya lo resolvió cayendo en el rol; aquí NO vale ese atajo, porque el
   rol lo escribe el navegador y esto es el sueldo del equipo. Se le pregunta al
   servidor —`admin_de`, la misma que usa el horario— y él contesta. */
let VEO_TODAS = esPuestoDeGestion_(_yo && _yo.puesto);

/* Mientras no se sepa, esta pantalla no es «de nadie»: está preguntando. Solo
   se pregunta cuando hace falta —sin ficha y sin puesto de gestión—, así que
   para todo el que entra con su número esto vale `false` y no cambia nada: ni
   una llamada de más, ni un milisegundo de espera. */
const SESION_POR_RESOLVER = !VEO_TODAS && !MI_EMPNO;
let _comprobandoSesion = SESION_POR_RESOLVER;

let D = { empleados: [] };
// Cache ilegible: se arranca vacio y la nube lo llena; si tampoco responde,
// avisoNube() lo dice en pantalla.
try{ const c = JSON.parse(localStorage.getItem(COMISKEY)||'null'); if(c && Array.isArray(c.empleados)) D = c; }catch(e){}

/* La caché del teléfono trae el equipo entero, guardado antes de que esto
   filtrara. Sin esta línea, el asesor seguiría abriendo la app y viendo el
   sueldo de sus compañeros —el dato ya está en SU teléfono— hasta que la nube
   contestara, y para siempre si no hay red. Se filtra al arrancar y se vuelve
   a guardar ya filtrada, así el dato viejo deja de existir ahí. */
/* Lo que había guardado, antes de filtrar. Se conserva SOLO mientras se
   pregunta al servidor quién eres: si resulta que mandas, es tu propia caché y
   se te devuelve entera —así el gerente sin red sigue viendo al equipo—; si
   resulta que no, se tira y se reescribe filtrada, igual que siempre. */
const _cacheCruda = D.empleados;
D.empleados = soloLoMio_(D.empleados);
// Sin espacio para guardar: se pierde la limpieza de la caché, no el filtro —
// lo que se pinta ya salió de `soloLoMio_`. Se reintenta en la próxima apertura.
// Mientras se pregunta no se reescribe: borrarla ahora sería tirar la del
// gerente por una respuesta que aún no ha llegado.
if(!VEO_TODAS && !SESION_POR_RESOLVER){ guardarCache_(); }
function guardarCache_(){
  // Callar es correcto: sin espacio para guardar se pierde la limpieza de la
  // caché, no el filtro — lo que se pinta ya salió de `soloLoMio_`. Se reintenta
  // en la próxima apertura, y avisar aquí no le daría a nadie nada que hacer.
  try{ localStorage.setItem(COMISKEY, JSON.stringify(D)); }catch(e){}
}

/* La red de seguridad del cliente, para el rato en que el SQL nuevo todavía no
   está pegado y el servidor sigue devolviendo a todos. No sustituye al filtro
   del servidor —el dato ya habría viajado— pero evita que la pantalla lo
   enseñe mientras tanto. */
function soloLoMio_(lista){
  if(VEO_TODAS) return Array.isArray(lista) ? lista : [];
  if(!Array.isArray(lista)) return [];
  return lista.filter(function(e){ return String(e.empNo || '') === MI_EMPNO; });
}

function pintarPeriodos(){
  document.getElementById('updated').textContent = D.actualizado || '—';
  document.getElementById('pComis').textContent = D.periodoComisiones || '—';
  document.getElementById('pGar').textContent = D.periodoGarantias || '—';
}
pintarPeriodos();

function money(n){
  return '$' + Number(n||0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function nombreCorto(n){ const p=(n||'').split(' '); return p[0]+(p[1]?' '+p[1]:''); }

function alcanceBadge(pct){
  if (pct == null) return '';
  const cls = pct >= 100 ? 'ok' : pct >= 70 ? 'warn' : 'bad';
  return `<span class="badge ${cls}">${pct}% de meta</span>`;
}

function garantiaColor(pct){
  if (pct >= 25) return 'var(--verde)';
  if (pct >= 15) return 'var(--naranja)';
  return 'var(--rojo)';
}

function cardEmpleado(e){
  const extra = (e.garantiaPct == null)
    ? `<div class="extra"><div class="extra-head">🛡️ Extracobertura</div><div class="extra-none">Sin datos en este periodo.</div></div>`
    : `<div class="extra">
        <div class="extra-head">🛡️ Extracobertura</div>
        <div class="extra-grid">
          <div class="extra-pct" style="color:${garantiaColor(e.garantiaPct)}">${e.garantiaPct}%</div>
          <div class="extra-det">${e.garantiaPzas} de ${e.garantiaElegible} piezas elegibles<br>${money(e.garantiaMonto)} en extracobertura</div>
        </div>
      </div>`;
  return `<div class="card">
    <div class="top">
      <div><h3>${e.nombre}</h3><div class="puesto">${e.puesto}</div></div>
    </div>
    <div class="venta-row"><span class="venta">${money(e.venta)}</span><span class="venta-lbl">venta para comisión</span></div>
    <div class="meta">${alcanceBadge(e.alcance)}<span class="badge">${e.pptoPct}% de aplicación</span></div>
    ${extra}
  </div>`;
}

function render(){
  const list = (D.empleados||[]).slice().sort((a,b)=> (b.venta||0)-(a.venta||0));

  /* Sin número no se sabe de quién enseñar la comisión, y «no sé quién eres» no
     puede acabar en «toma las de todos». Pasa cuando se entró con el PIN de la
     tienda en vez de con el número propio. Se dice qué falta y cómo se arregla:
     un «no hay comisiones» aquí sería mentira y mandaría a pedirle al gerente
     que suba algo que ya está subido. */
  /* Todavía se le está preguntando al servidor si quien mira manda aquí. No es
     lo mismo que «no sé quién eres»: decirle al gerente que entre con su número
     y cambiárselo medio segundo después por el equipo entero es un parpadeo que
     se lee como un fallo. Dura lo que tarde `admin_de`, y si el CDN no cargó
     se resuelve solo con el DOMContentLoaded. */
  if(_comprobandoSesion){
    document.getElementById('app').innerHTML =
      '<div class="nota">Comprobando tu sesión…</div>';
    return;
  }
  if(!VEO_TODAS && !MI_EMPNO){
    document.getElementById('app').innerHTML =
      '<div class="nota">Para ver tu comisión, entra con <b>tu número de empleado</b>. '
      + 'Esta pantalla es personal: cada quien ve la suya.<br><br>'
      + '<a href="index.html" style="color:var(--rojo);font-weight:700">Volver a entrar</a></div>';
    return;
  }
  if(!list.length){
    document.getElementById('app').innerHTML = VEO_TODAS
      ? '<div class="nota">Aún no hay comisiones cargadas para esta tienda. Pide al gerente que las suba.</div>'
      /* Para el asesor, «no hay para esta tienda» sería falso el mes en que las
         hay para los demás y no para él: lo que pasa es que su número no está en
         el reporte, y eso lo arregla el gerente, no esperar. */
      : '<div class="nota">Todavía no aparece tu comisión de este periodo. '
        + 'Si tus compañeros ya ven la suya, pídele al gerente que revise tu número '
        + 'en el reporte.</div>';
    return;
  }
  document.getElementById('app').innerHTML =
    (VEO_TODAS
      ? `<div class="grupo-titulo">👥 Equipo — ${list.length} integrante${list.length!==1?'s':''}</div>`
      : `<div class="grupo-titulo">💰 Tu comisión</div>`) +
    list.map(cardEmpleado).join('');
}
render();

/* Aviso visible cuando la nube no responde. Sin esto la página se queda con lo
   guardado en el teléfono y parece al día, que es justo lo que pasó al cerrar
   el Apps Script: se veían comisiones de julio como si fueran de agosto. */
function avisoNube(msg){
  let el = document.getElementById('avisoNube');
  if(!el){
    el = document.createElement('div');
    el.id = 'avisoNube';
    el.style.cssText = 'margin:12px 16px;padding:10px 12px;border-radius:10px;'
      + 'background:#fdf3dc;border-left:3px solid #F37021;color:#7a5200;'
      + 'font-size:12.5px;line-height:1.45;font-weight:600';
    const m = document.querySelector('main');
    if(m) m.insertBefore(el, m.firstChild); else document.body.appendChild(el);
  }
  el.textContent = '⚠ ' + msg;
}

/* Desde el 7-ago-2026 las comisiones se suben directo a Supabase, así que hay
   que LEERLAS de ahí: la hoja ya no las recibe y el Apps Script devolvería el
   último reporte que se subió antes del cambio — un mes viejo, con aspecto de
   actual. Esa pantalla la mira el equipo para saber cuánto lleva ganado.

   Se intenta Supabase primero y, si no contesta, se cae al Apps Script: los
   reportes anteriores siguen en la hoja y valen más que una pantalla vacía. */
const SB_URL_CO = 'https://rjdrljtujbwooejrpyqv.supabase.co';
const SB_KEY_CO = 'sb_publishable_mELjDmCaFpNOxcwPi5MB2A_qSZ5ZA2z';

/* ── El gerente que entró con su correo (15-sep-2026) ─────────────────────
   Tres piezas, y las tres hacen falta: sin biblioteca no hay sesión, sin sesión
   no hay token, y sin token el servidor no tiene forma de saber quién pregunta
   —la clave publicable no identifica a nadie, que es justo lo que la hace
   publicable—. */

// 1 · Esperar a supabase-js sin colgar la pantalla si el CDN no llega. El
//     <script> es `defer`, así que ya está listo para el DOMContentLoaded; si
//     falló la descarga, ese evento llega igual y se sigue sin sesión.
function supaListo_(){
  return new Promise(function(res){
    function ya(){ res((window.supabase && window.supabase.createClient) ? window.supabase : null); }
    if(window.supabase && window.supabase.createClient) return ya();
    if(document.readyState !== 'loading') return ya();
    addEventListener('DOMContentLoaded', ya);
    // El CDN que ni responde ni falla: a los 5 s se sigue sin él.
    setTimeout(ya, 5000);
  });
}

// 2 · El token de la sesión, para que la RPC viaje firmada. Vacío = se pregunta
//     con la clave publicable, igual que siempre.
let _tokenSesion = '';

/* 3 · ¿Manda en esta tienda? Lo dice el SERVIDOR. `admin_de` responde que sí
   por los dos caminos —dueña de la tienda, o ficha activa con admin—, es la
   misma que usa el horario, y con la clave publicable responde que no porque
   `auth.uid()` viene vacío. Nada de esto se decide mirando `hes1217_role`: ese
   lo escribe el navegador, y aquí se enseña el sueldo del equipo. */
async function confirmarSesion_(){
  try{
    const lib = await supaListo_();
    if(!lib) return false;
    const cli = lib.createClient(SB_URL_CO, SB_KEY_CO);
    const ses = ((await cli.auth.getSession()).data || {}).session;
    if(!ses || !ses.access_token) return false;
    _tokenSesion = ses.access_token;
    const r = await cli.rpc('admin_de', { p_store_id: String(_storeId) });
    return !!(r && r.data === true);
  }catch(e){ return false; }
}

/* Una llamada a la RPC, con el cuerpo que se le pase. Separada para poder
   intentar la firma nueva y caer a la vieja sin repetir la fontanería. */
async function _rpcComisiones(cuerpo){
  const ctl = new AbortController();
  const t = setTimeout(function(){ ctl.abort(); }, 8000);
  try{
    /* Con sesión se firma con ella; sin sesión, con la clave publicable. Es lo
       único que separa «soy el gerente de la 1217» de «traigo la clave que
       viene dentro del HTML». */
    const r = await fetch(SB_URL_CO + '/rest/v1/rpc/comisiones_lista', {
      method:'POST', signal: ctl.signal,
      headers:{ apikey:SB_KEY_CO, Authorization:'Bearer '+(_tokenSesion || SB_KEY_CO), 'Content-Type':'application/json' },
      body: JSON.stringify(cuerpo)
    });
    if(!r.ok) return null;
    const filas = await r.json();
    return Array.isArray(filas) ? filas : null;
  }catch(e){ return null; }
  finally{ clearTimeout(t); }
}

let _motivoVacio = '';
async function comisionesDeSupabase(){
  if(!_storeId) return null;
  try{
    /* Primero la versión que filtra en el servidor. Mientras el SQL no esté
       pegado, esa firma NO EXISTE y PostgREST responde 404: entonces se llama a
       la vieja, que devuelve el equipo entero, y el filtro lo hace `soloLoMio_`
       aquí abajo. La pantalla funciona en los dos mundos, así que da igual si se
       publica la app antes o después de pegar el SQL — pero hasta pegarlo, el
       dato sigue viajando al teléfono. */
    let filas = await _rpcComisiones({ p_store: String(_storeId),
                                       p_token: GAS_TOKEN,
                                       p_empno: MI_EMPNO });
    if(filas === null) filas = await _rpcComisiones({ p_store: String(_storeId) });
    /* «No contestó» y «contestó que no hay nada» acaban los dos en `null`, y para
       quien mira significan cosas distintas. Se anota cuál fue para poder
       avisar de lo que de verdad pasó. */
    _motivoVacio = (filas === null) ? 'sin-respuesta' : 'vacio';
    if(!filas || !filas.length) return null;
    // Supabase devuelve filas; esta pantalla espera el objeto del Apps Script.
    return {
      actualizado: filas[0].actualizado ? String(filas[0].actualizado).slice(0,10) : '',
      periodoComisiones: filas[0].periodo || '',
      periodoGarantias:  filas[0].periodo_gar || '',
      /* `soloLoMio_` va DESPUÉS del mapeo, no antes: compara contra `empNo`, que
         es la clave que usa el resto de la pantalla. Con la función nueva del
         servidor esto ya no quita nada —llega filtrado—; con la vieja es lo
         único que separa a un asesor del sueldo de sus compañeros. */
      empleados: soloLoMio_(filas.map(function(k){
        return { empNo:k.empno||'', nombre:k.nombre||'', puesto:k.puesto||'',
                 venta:Number(k.venta)||0, pptoPct:Number(k.ppto_pct)||0,
                 alcance:Number(k.alcance)||0,
                 // null NO es 0: "sin dato" y "cero garantías" se ven igual en
                 // pantalla pero significan cosas distintas para quien cobra.
                 garantiaPct: k.gar_pct==null ? null : Number(k.gar_pct),
                 garantiaPzas: k.gar_pzas==null ? null : Number(k.gar_pzas),
                 garantiaElegible: k.gar_elegible==null ? null : Number(k.gar_elegible),
                 garantiaMonto: k.gar_monto==null ? null : Number(k.gar_monto) };
      }))
    };
  }catch(e){ return null; }
}

// Trae la versión más reciente desde la nube de esta tienda (si Admin ya la configuró)
async function refreshComisionesCloud(){
  /* Primero, quién mira — y solo si no se sabía ya. Va ANTES de pedir las
     comisiones porque decide dos cosas de la misma petición: con qué se firma
     y qué se puede pintar de lo que vuelva. */
  if(SESION_POR_RESOLVER){
    const manda = await confirmarSesion_();
    _comprobandoSesion = false;
    if(manda){
      // Era su caché: se le devuelve entera mientras llega la nube. Sin esto, el
      // gerente sin señal ve la pantalla vacía teniendo el dato en el teléfono.
      VEO_TODAS = true;
      D.empleados = _cacheCruda;
    }else{
      // No manda: ahora sí se limpia lo que quedó guardado de antes.
      guardarCache_();
    }
    render();
  }

  const sb = await comisionesDeSupabase();
  if(sb){
    D = sb;
    guardarCache_();
    pintarPeriodos();
    render();
    return;
  }

  /* El servidor contestó, y contestó que nada — teniendo sesión de quien manda.
     Son dos causas y el gerente no puede distinguirlas desde la pantalla, así
     que se nombran las dos en vez de dejarle «no hay comisiones», que puede ser
     falso. Este aviso vive exactamente en la ventana entre publicar la app y
     pegar el SQL; cuando el permiso está aplicado, no aparece. */
  if(_tokenSesion && VEO_TODAS && _motivoVacio === 'vacio'){
    avisoNube('No llegaron comisiones. O todavía no se sube el reporte de este '
            + 'periodo, o falta aplicar en Supabase el permiso del gerente por '
            + 'correo (supabase_comisiones_gerente_correo.sql).');
    return;
  }
  if(!CLOUD_URL) return;
  const cb = '_cbComis' + Date.now();
  window[cb] = function(data){
    delete window[cb];
    const sc = document.getElementById('_comis_sc'); if(sc) sc.remove();
    if(data && data.error){ avisoNube('La nube rechazó la consulta (' + data.error + '). Vuelve a entrar desde el menú.'); return; }
    if(data && Array.isArray(data.empleados) && data.empleados.length){
      /* El respaldo por Apps Script devolvía el equipo entero y no sabe filtrar:
         lee una hoja. Desde el 6-sep-2026 ese modo está apagado en el GAS —la
         hoja llevaba desde el 7-ago sin recibir y servía JULIO con cara de hoy—,
         así que esta rama ya casi no se alcanza. El filtro se queda igual: es la
         segunda puerta a lo mismo, y el día que alguien reactive ese modo no va
         a acordarse de esto.

         ⚠️ Y aquí filtra de más, a propósito: la hoja NO trae número de empleado,
         así que a un asesor no le casa ninguna fila y se queda sin ver la suya.
         Es lo correcto de los dos errores posibles — casar por nombre es lo que
         descuadró las comisiones de agosto, por un apellido con una letra de
         más. Antes de enseñar la de otro, mejor no enseñar ninguna. */
      D = Object.assign({}, data, { empleados: soloLoMio_(data.empleados) });
      localStorage.setItem(COMISKEY, JSON.stringify(D));
      pintarPeriodos();
      render();
      return;
    }
    // Respuesta sin datos: antes se ignoraba en silencio y la pantalla se
    // quedaba con el caché viejo, que parecía actualizado.
    avisoNube('No llegaron datos nuevos. Lo que ves es lo último guardado en este teléfono.');
  };
  const sc = document.createElement('script');
  sc.id = '_comis_sc';
  sc.src = CLOUD_URL + (CLOUD_URL.includes('?')?'&':'?') + 'modo=comisiones&callback=' + cb
         + (GAS_TOKEN ? '&t=' + encodeURIComponent(GAS_TOKEN) : '');
  sc.onerror = function(){ delete window[cb]; sc.remove(); avisoNube('Sin conexión con la nube.'); };
  document.head.appendChild(sc);
}
refreshComisionesCloud();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).catch(()=>{});
}
</script>
