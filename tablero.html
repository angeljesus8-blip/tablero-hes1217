<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#D12026">
<title>Tablero del Equipo · HES 1217</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HES 1217">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --rojo:#D12026; --naranja:#F37021; --azul:#336BB4; --verde:#1a8c4e;
    --gris:#777; --linea:#ececec; --bg:#f6f6f7;
  }
  body { font-family:'Montserrat',sans-serif; background:var(--bg); color:#1a1a1a; padding-bottom:40px; }

  /* ---------- Header ---------- */
  header {
    background:#fff; border-bottom:3px solid var(--rojo);
    padding:14px 16px; display:flex; align-items:center; gap:12px;
    position:sticky; top:0; z-index:30;
  }
  header .back { text-decoration:none; color:var(--rojo); font-size:30px; font-weight:700;
    line-height:1; padding:0 6px 4px 0; display:flex; align-items:center; }
  header img { height:34px; width:auto; }
  .h-txt h1 { font-size:15px; font-weight:800; letter-spacing:-.2px; }
  .h-txt p { font-size:11px; color:var(--gris); margin-top:1px; }
  .updated { margin-left:auto; font-size:10px; color:#aaa; text-align:right; line-height:1.3; }
  .updated b { color:var(--verde); display:block; font-size:11px; }
  #liveWarning { display:none; align-items:flex-start; gap:10px; background:#fff5ee;
    border-left:4px solid var(--naranja); margin:0 16px 8px; border-radius:10px;
    padding:12px 14px; font-size:12px; line-height:1.5; }
  #liveWarning.visible { display:flex; }
  #liveWarning .lw-icon { font-size:20px; flex-shrink:0; margin-top:1px; }
  /* Solo el título va en bloque: los <b> dentro del mensaje deben quedar en línea */
  #liveWarningTitulo { font-size:13px; font-weight:800; color:var(--rojo); display:block; margin-bottom:2px; }
  #liveWarning p { color:#7a4a00; font-weight:600; margin:0; }
  #liveWarning.err { background:#fdeaea; border-color:var(--rojo); }
  #liveWarning.err p { color:var(--rojo); }

  /* ---------- Buscador ---------- */
  .search-wrap { position:sticky; top:64px; z-index:25; background:var(--bg); padding:12px 16px 6px; }
  .search { display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--linea);
    border-radius:12px; padding:11px 14px; }
  .search:focus-within { border-color:var(--rojo); }
  .search input { border:none; outline:none; flex:1; font-family:inherit; font-size:15px; background:transparent; }
  .search svg { flex-shrink:0; }

  /* ---------- Filtros (chips) ---------- */
  .chips { display:flex; gap:8px; overflow-x:auto; padding:8px 16px 4px; -ms-overflow-style:none; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex-shrink:0; border:1.5px solid var(--linea); background:#fff; color:#555;
    font-family:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:20px;
    cursor:pointer; white-space:nowrap; transition:.12s;
  }
  .chip .n { font-size:11px; opacity:.6; margin-left:3px; }
  .chip.active { background:var(--rojo); color:#fff; border-color:var(--rojo); }

  /* ---------- Contenido ---------- */
  main { padding:8px 16px 0; max-width:560px; margin:0 auto; }
  .grupo-titulo { font-size:11px; font-weight:700; color:#999; text-transform:uppercase;
    letter-spacing:1px; margin:18px 4px 8px; }

  .card { background:#fff; border:1px solid var(--linea); border-left-width:4px;
    border-radius:12px; padding:13px 15px; margin-bottom:10px; }
  .card.alta { box-shadow:0 2px 10px rgba(209,32,38,.07); }
  .card.t-promo  { border-left-color:var(--naranja); }
  .card.t-bundle { border-left-color:var(--verde); }
  .card.t-eol   { border-left-color:var(--rojo); }
  .card.t-nov   { border-left-color:var(--azul); }
  .card.t-aviso { border-left-color:var(--verde); }
  .card.t-trans { border-left-color:#7c3aed; }

  .card .top { display:flex; align-items:flex-start; gap:8px; }
  .card h3 { font-size:14.5px; font-weight:700; line-height:1.3; flex:1; }
  /* Título de las tarjetas de promo y precio regular: va solo, sin la fila
     .top, porque el peso visual ahora lo carga el precio de abajo. */
  .card h3.t-titulo { flex:none; margin:0 0 7px; font-size:13.5px; }
  .badge.b-promo { background:#fdecec; color:var(--rojo); }
  .tag { font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px;
    padding:3px 7px; border-radius:6px; flex-shrink:0; }
  .tag.promo  { background:#fff5ee; color:var(--naranja); }
  .tag.bundle { background:#edfaf3; color:var(--verde); }
  .tag.eol   { background:#fdeaea; color:var(--rojo); }
  .tag.nov   { background:#eef3fb; color:var(--azul); }
  .tag.aviso { background:#eafaf1; color:var(--verde); }
  .tag.trans { background:#f3effe; color:#7c3aed; }
  .card p.det { font-size:12.5px; color:#555; line-height:1.45; margin-top:6px; }
  .card p.warn { font-size:11px; color:var(--rojo); line-height:1.4; margin-top:8px;
    background:#fdeaea; padding:6px 9px; border-radius:7px; font-weight:600; }

  .meta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:9px; }
  .precio { font-size:16px; font-weight:800; color:var(--rojo); }
  .precio .antes { font-size:12px; color:#bbb; text-decoration:line-through; font-weight:600; margin-right:6px; }
  .badge { font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; background:#f2f2f2; color:#666; }
  .badge.urge { background:#fdeaea; color:var(--rojo); }
  .badge.ok { background:#eafaf1; color:var(--verde); }
  /* Existencias dentro de la tarjeta de promo: verde hay, ámbar quedan pocas,
     rojo no hay. Va primero en la fila de badges para que se vea antes que el
     precio — de nada sirve la promo si no queda pieza. */
  .badge.stock-b.hay  { background:#eafaf1; color:var(--verde); }
  .badge.stock-b.poco { background:#fff5ee; color:var(--naranja); }
  .badge.stock-b.sin  { background:#fdeaea; color:var(--rojo); }
  /* Agotado en tienda pero vendible: se pide a otra sucursal. Morado para que
     no se confunda con "no hay" ni con "quedan pocas". */
  .badge.stock-b.traer{ background:#f3effe; color:#6d3fd4; }

  /* ---------- Inventario ---------- */
  .inv-row { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--linea);
    border-radius:10px; padding:11px 14px; margin-bottom:8px; }
  .inv-info { flex:1; min-width:0; }
  .inv-info h4 { font-size:13.5px; font-weight:700; }
  .inv-info span { font-size:11px; color:#aaa; }
  .stock { text-align:center; flex-shrink:0; }
  .stock .num { font-size:20px; font-weight:800; line-height:1; }
  .stock .lbl { font-size:9px; color:#aaa; text-transform:uppercase; letter-spacing:.5px; }
  .stock .lbl.lbl2 { font-size:8px; }
  .stock.ok .num { color:var(--verde); }
  .stock.bajo .num { color:var(--naranja); }
  .stock.cero .num { color:var(--rojo); }
  .exh { font-size:10px; font-weight:700; color:var(--azul); background:#eef3fb;
    padding:4px 8px; border-radius:7px; flex-shrink:0; white-space:nowrap; }
  .exh.eol-ready { background:#eafaf1; color:var(--verde); }
  .exh.eol-pend { background:#fff5ee; color:var(--naranja); }
  .exh.trans-b { background:#f3effe; color:#7c3aed; }
  /* Precio de promoción dentro de la fila de inventario: el asesor ve las
     piezas y a cuánto se vende sin cambiar de pestaña. */
  .exh.promo-b { background:#fdecec; color:var(--rojo); }
  .card.t-eol.listo { border-left-color:var(--verde); background:#f7fdfa; box-shadow:0 2px 10px rgba(26,140,78,.10); }
  .eol-status { font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; padding:3px 7px; border-radius:6px; flex-shrink:0; }
  .eol-status.pend { background:#fff5ee; color:var(--naranja); }
  .eol-status.agot { background:#f2f2f2; color:#888; }
  .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot.ok{background:var(--verde);} .dot.bajo{background:var(--naranja);} .dot.cero{background:var(--rojo);}
  /* ---- Selector seguro + MSI ---- */
  .seg-sel { margin-top:8px; }
  .seg-chips { display:flex; gap:6px; flex-wrap:wrap; margin:9px 0 0; }
  /* Datos de referencia (SKU, exhibición, meses): presentes pero en voz baja,
     para que el precio y las piezas se lean primero. */
  .t-ref { font-size:10.5px; color:#a8a2a2; line-height:1.5; margin-top:7px; }
  .t-ref b { color:#8a8484; font-weight:700; }
  .seg-chip { border:1.5px solid var(--linea); background:#fff; color:#555;
    font-family:inherit; font-size:12px; font-weight:700; padding:6px 13px;
    border-radius:20px; cursor:pointer; transition:.12s; }
  .seg-chip.active { background:var(--azul); color:#fff; border-color:var(--azul); }
  .seg-desglose { display:flex; align-items:baseline; flex-wrap:wrap; gap:4px; margin-bottom:0; }
  .seg-precio-total { font-size:25px; font-weight:800; color:var(--rojo); line-height:1.15;
    font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  /* Precio regular tachado, junto al de promo: el ahorro se ve sin buscarlo. */
  .precio-reg { font-size:13px; font-weight:700; color:#bfb9b9; text-decoration:line-through;
    font-variant-numeric:tabular-nums; }
  .precio-linea { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .seg-prod { font-size:16px; font-weight:700; color:#999; }
  .seg-op { font-size:13px; color:#aaa; font-weight:600; white-space:nowrap; }
  .seg-msi { margin-top:5px; }
  .msi-badge { display:inline-block; font-size:11px; font-weight:700;
    padding:4px 9px; border-radius:7px; }
  .msi-6  { background:#eafaf1; color:var(--verde); }
  .msi-12 { background:#eef3fb; color:var(--azul); }
  .msi-18 { background:#fff5ee; color:var(--naranja); }

  .empty { text-align:center; color:#bbb; font-size:13px; padding:40px 20px; }
  footer { text-align:center; font-size:10px; color:#ccc; margin-top:24px; padding:0 16px; }
  .promo-toolbar { display:flex; align-items:center; justify-content:space-between; padding:8px 16px 4px; }
  .promo-toolbar span { font-size:12px; color:#aaa; font-weight:600; }
  .promo-toolbar button { font-family:'Montserrat',sans-serif; font-size:12px; font-weight:700;
    background:var(--rojo); color:#fff; border:none; border-radius:8px; padding:6px 13px; cursor:pointer; }
  .promo-toolbar button:disabled { background:#ccc; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .promo-toolbar button.girando { animation:spin .7s linear infinite; }
  /* ---- Slider promos ---- */
  .promo-tabs { display:flex; gap:8px; padding:8px 16px 4px; }
  .promo-tab { flex:1; padding:9px 10px; border:1.5px solid var(--linea); background:#fff;
    border-radius:20px; font-family:'Montserrat',sans-serif; font-size:12px; font-weight:700;
    cursor:pointer; color:#555; transition:.15s; }
  .promo-tab.active { background:var(--azul); color:#fff; border-color:var(--azul); }
  .promo-slider { display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .promo-slider::-webkit-scrollbar { display:none; }
  .promo-slide { min-width:100%; scroll-snap-align:start; box-sizing:border-box; }
  .promo-dots { display:flex; justify-content:center; gap:8px; padding:6px 0 2px; }
  .promo-dot { width:8px; height:8px; border-radius:50%; background:#e0e0e0; transition:.15s; }
  .promo-dot.active { background:var(--azul); }
  /* ---- Dashboard ---- */
  .att-card { padding:18px 18px 14px; }
  .att-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:13px; font-weight:700; color:#555; }
  .att-reset { background:none; border:1.5px solid var(--linea); border-radius:8px; padding:4px 10px; font-family:'Montserrat',sans-serif; font-size:11px; font-weight:700; color:#aaa; cursor:pointer; }
  .att-rate { font-size:54px; font-weight:800; line-height:1; margin-bottom:4px; }
  .att-sub { font-size:12px; color:#888; font-weight:600; margin-bottom:10px; min-height:16px; }
  /* ── Barra de meta ── */
  .att-prog { margin:0 0 12px; }
  .att-prog-track { position:relative; height:9px; background:#f0f0f0; border-radius:10px; overflow:hidden; }
  .att-prog-fill { height:100%; border-radius:10px; transition:.4s; }
  .att-prog-goal { position:absolute; top:0; bottom:0; left:25%; width:2.5px; background:var(--verde); opacity:.5; }
  .att-prog-lbl { display:flex; justify-content:space-between; font-size:10px; color:#bbb; font-weight:600; margin-top:3px; }
  .att-prog-lbl .meta { color:var(--verde); }
  /* ── Leaderboard ── */
  .lead-card { padding:14px 15px; }
  .lead-head { font-size:11px; font-weight:800; color:#999; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
  .lead-row { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--linea); }
  .lead-row:last-of-type { border-bottom:none; }
  .lead-name { flex:1; font-size:13px; font-weight:700; }
  .lead-ventas { font-size:11px; color:#aaa; font-weight:700; white-space:nowrap; min-width:52px; text-align:center; }
  .lead-att { font-size:12px; font-weight:800; white-space:nowrap; min-width:80px; text-align:right; }
  .lead-fuente { font-size:10px; color:#bbb; font-weight:600; margin-top:9px; text-align:center; line-height:1.4; }
  .lw-btn { background:#fff; border:1.5px solid var(--naranja); color:var(--naranja); border-radius:8px;
    padding:5px 11px; font-family:'Montserrat',sans-serif; font-size:11px; font-weight:800; cursor:pointer; margin-top:7px; }
  #liveWarning.err .lw-btn { border-color:var(--rojo); color:var(--rojo); }
  /* ── Botones ── */
  .att-btns { display:flex; gap:10px; }
  .att-btn { flex:1; padding:12px; border:none; border-radius:12px; font-family:'Montserrat',sans-serif; font-size:13px; font-weight:800; cursor:pointer; }
  .att-si { background:#eafaf1; color:var(--verde); }
  .att-no { background:#fdeaea; color:var(--rojo); }
  .dash-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px 16px; }
  .dash-stat { background:#fff; border-radius:14px; padding:16px 12px; text-align:center; border:1px solid #ececec; cursor:pointer; active:opacity:.8; }
  .dash-n { font-size:34px; font-weight:800; line-height:1; color:#1a1a1a; }
  .dash-lbl { font-size:11px; color:#888; font-weight:700; margin-top:5px; }
  /* ---- WhatsApp share ---- */
  .btn-wa { display:flex; align-items:center; justify-content:center; gap:6px; background:#eafaf1; color:#128C7E; border:none; border-radius:10px; padding:9px 14px; font-family:'Montserrat',sans-serif; font-size:12px; font-weight:700; cursor:pointer; margin-top:10px; width:100%; }

  .eol-bundle-tip { margin-top:10px; padding:9px 11px; border-radius:9px; background:#fff8ec; border:1px solid #ffe6bd; }
  .eol-bundle-tip .tip-lbl { font-size:10.5px; font-weight:800; color:var(--naranja); text-transform:uppercase; letter-spacing:.4px; }
  .eol-bundle-tip .tip-nom { font-size:12.5px; font-weight:700; margin-top:2px; }
  .eol-bundle-tip .precio { font-size:15px; }

  .combo-group { margin-bottom:16px; }
  .combo-group-lbl { font-size:11.5px; font-weight:800; color:var(--naranja); margin:0 2px 8px; display:flex; align-items:center; gap:5px; }
  .combo-carousel { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:0 2px 6px; margin:0 -2px; }
  .combo-carousel::-webkit-scrollbar { display:none; }
  .combo-slide { flex:0 0 88%; width:88%; min-width:0; scroll-snap-align:start; }
  .combo-slide .card { margin-bottom:0; height:100%; }
  .combo-dots { display:flex; justify-content:center; gap:6px; margin-top:2px; }
  .combo-dots span { width:5px; height:5px; border-radius:50%; background:#e0d5c5; }

  .bundle-desglose { margin-top:10px; }
  .dg-row { display:flex; justify-content:space-between; gap:12px; font-size:12px; padding:3px 0; color:#555; align-items:baseline; }
  .dg-row > span { line-height:1.3; }
  .dg-row b { font-weight:700; color:#333; white-space:nowrap; }
  .dg-row em { color:#aaa; font-style:normal; font-size:10px; font-weight:600; }
  .dg-sub { border-top:1px solid var(--linea); margin-top:4px; padding-top:6px; color:#888; font-weight:600; }
  .dg-seg span, .dg-seg b { color:var(--verde); }
  .dg-regalo span { color:var(--naranja); font-weight:600; }
  .dg-regalo b { color:var(--naranja); font-weight:700; font-size:11px; }
  .dg-total { border-top:2px solid var(--rojo); margin-top:5px; padding-top:6px; font-size:14px; }
  .dg-total span { font-weight:700; color:#333; }
  .dg-total b { color:var(--rojo); font-size:16px; }

  /* ---- Preventa ---- */
  .card.t-preventa { border-left-color:#7c3aed; }
  .card.t-preventa.pv-agot { opacity:.55; }
  .pv-banner { background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff; border-radius:14px; padding:14px 16px; margin-bottom:14px; }
  .pv-banner-t { font-size:16px; font-weight:800; }
  .pv-banner-s { font-size:11.5px; opacity:.92; margin-top:3px; line-height:1.4; }
  .pv-banner-n { font-size:12px; font-weight:700; margin-top:8px; background:rgba(255,255,255,.18); display:inline-block; padding:4px 10px; border-radius:8px; }
  .pv-cupo { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.3px; padding:3px 8px; border-radius:6px; flex-shrink:0; white-space:nowrap; }
  .pv-cupo.ok { background:#edfaf3; color:var(--verde); }
  .pv-cupo.pocas { background:#fff5ee; color:var(--naranja); }
  .pv-cupo.ultima { background:#fdeaea; color:var(--rojo); }
  .pv-cupo.agot { background:#f2f2f2; color:#999; }
  .pv-meta { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .pv-reg { font-size:11px; color:#bbb; text-decoration:line-through; font-weight:600; }
  .pv-msi { font-size:11px; color:var(--azul); font-weight:700; }
  .pv-seg { font-size:12px; color:var(--verde); margin-top:6px; }
  .pv-btns { display:flex; gap:8px; margin-top:10px; }
  .btn-apartar { flex:1; background:#7c3aed; color:#fff; border:none; border-radius:10px; padding:10px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .btn-apartar:disabled { background:#ddd; color:#999; cursor:default; }
  .btn-wa.pv-wa { width:auto; margin-top:0; padding:9px 14px; flex-shrink:0; }
  .ap-row { display:flex; align-items:center; gap:10px; padding:11px 14px; }
  .ap-est { font-size:10px; font-weight:800; text-transform:uppercase; padding:3px 8px; border-radius:6px; background:#f3effe; color:#7c3aed; flex-shrink:0; }
  .ap-est.ent { background:#eafaf1; color:var(--verde); }

  /* ---- Modal apartado ---- */
  .ap-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200; align-items:flex-end; justify-content:center; }
  .ap-modal.show { display:flex; }
  .ap-box { background:#fff; width:100%; max-width:480px; border-radius:18px 18px 0 0; padding:18px 18px 24px; max-height:92vh; overflow-y:auto; }
  .ap-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .ap-title { font-size:16px; font-weight:800; line-height:1.25; }
  .ap-sub { font-size:12px; color:#888; font-weight:600; margin-top:2px; }
  .ap-close { background:none; border:none; font-size:20px; color:#aaa; cursor:pointer; line-height:1; }
  .ap-lbl { display:block; font-size:11px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:.4px; margin:10px 2px 5px; }
  .ap-inp { width:100%; border:1.5px solid var(--linea); border-radius:11px; padding:12px 14px; font-family:inherit; font-size:15px; outline:none; }
  .ap-inp:focus { border-color:#7c3aed; }
  .ap-toggle { display:flex; align-items:center; gap:9px; font-size:13.5px; margin:16px 2px 4px; cursor:pointer; }

/* ---- El día, en vivo ----
   La app queda abierta como PWA días enteros en el celular del asesor, así que
   la fecha NO se puede fijar al cargar: tocarDia() la vuelve a leer y avisa
   cuando ya cambió el día.
   Siempre fecha LOCAL: toISOString() devuelve UTC y en México (UTC-6) a partir
   de las 6 pm ya es "mañana" — las promos que vencían ese mismo día se caían
   del tablero justo en la hora pico. */
let HOY = new Date();
function hoyISO(d){
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
let HOY_ISO = hoyISO(HOY);
/* Vigencia por fechas d1/d2 (ambas inclusive). EXIGE fecha de fin.
   Hasta el 1-ago-2026 la regla era "sin fecha = siempre vigente", y así 132 de
   las 141 promos de la hoja —cargadas sin vigencia— se mostraban para siempre:
   el equipo seguía viendo promociones terminadas en julio. Los 20 combos
   activos sí traen fecha, así que no les afecta.
   Si algo debe verse sin caducar, se le pone una fecha lejana; no se deja vacía. */
const vigenteHoy = x => !!x.d2 && (!x.d1 || HOY_ISO >= x.d1) && HOY_ISO <= x.d2;
// Relee el reloj. true = ya es otro día (hay que re-filtrar vigencias).
function tocarDia(){
  HOY = new Date();
  const iso = hoyISO(HOY);
  if(iso === HOY_ISO) return false;
  HOY_ISO = iso;
  return true;
}

function diasRestantes(fecha){
  const f = new Date(fecha+'T00:00:00');

  const base = new Date(HOY.getFullYear(), HOY.getMonth(), HOY.getDate());

const INV_KEY       = 'hes1217_inv_cache';

/* El precio va PRIMERO y los meses al final, en gris (rediseño del 1-ago-2026):
   la tarjeta mostraba once bloques con el mismo peso y no había dónde caer

   sacarlos del contenedor #id — selSeg busca .seg-desglose y .seg-msi ahí
   dentro, así que todo lo dinámico tiene que seguir colgando de él. */
function segSelector(sku, precioBase, precioVenta, enMedio, regularTachado) {
  const s = seguroPara(precioBase, sku);
  const p0 = parseFloat(String(precioVenta||0).replace(/[^0-9.]/g,'')) || 0;
  const p1 = s ? p0 + s.p1 : null;
  const p2 = s ? p0 + s.p2 : null;
  const i1 = s ? s.p1 : 0;
  const i2 = s ? s.p2 : 0;
  const id = 'sg_' + String(sku).replace(/\D/g,'');
  const chip1 = s ? `<button class="seg-chip" onclick="selSeg('${id}',1,${p0},${p1},${p2},${i1},${i2})">+ 1 año</button>` : '';
  const chip2 = s ? `<button class="seg-chip" onclick="selSeg('${id}',2,${p0},${p1},${p2},${i1},${i2})">+ 2 años</button>` : '';

  // cambiar de seguro, y si estuviera dentro se borraría en el primer toque.
  const tach = regularTachado ? `<span class="precio-reg">${money(regularTachado)}</span>` : '';

    </div>
    <div class="seg-msi">${msiInfo(p0)}</div>

}
function selSeg(id, idx, p0, p1, p2, i1, i2) {
  const wrap = document.getElementById(id);

/* ---- Assurant attach rate ----
   El attach se DERIVA de las ventas capturadas en Captura de Series, que ya
   guarda cada venta como {vend, fecha, seguro:true/false}. Antes esta tarjeta
   y el leaderboard leían 'attv_<vendedor>_<fecha>', una clave que ninguna app
   escribía nunca: el equipo aparecía siempre en "—" y el resumen de WhatsApp
   salía sin renglones por vendedor.
   Los botones ✓/✗ siguen existiendo, pero solo como AJUSTE MANUAL para ventas
   que no pasaron por la app (por eso se suman aparte y se pueden reiniciar). */
const SERIES_KEY = 'hes1217_series_v1';   // misma clave que escribe captura_series.html
let VENTAS_NUBE = null;        // {vendedor:{c,s}} de TODA la tienda; null = no disponible
let VENTAS_NUBE_HORA = '';

// El conteo manual se guarda por día; hoyISO() se relee cada vez, así que al
// cruzar la medianoche el contador arranca solo en cero.
function attKey(){ return 'att_'+hoyISO(); }
// Ajustes manuales del día (los botones ✓/✗)
function attManual(){ try{ return JSON.parse(localStorage.getItem(attKey())||'{"c":0,"s":0}'); }catch(e){ return {c:0,s:0}; } }

// Ventas capturadas HOY en este dispositivo
function ventasHoyLocal(){
  try{
    const items = JSON.parse(localStorage.getItem(SERIES_KEY)||'[]');
    const hoy = new Date().toLocaleDateString('es-MX');
    return items.filter(i=>i.fecha===hoy);
  }catch(e){ return []; }
}
// {vendedor:{c,s}} — de la nube si el GAS ya expone modo=ventas_hoy (toda la
// tienda); si no, de las capturas de este equipo.
function attPorVendedor(){
  if(VENTAS_NUBE) return VENTAS_NUBE;
  const acc = {};
  ventasHoyLocal().forEach(v=>{
    const n = v.vend || '(sin nombre)';
    if(!acc[n]) acc[n] = {c:0,s:0};
    if(v.seguro===true) acc[n].c++; else acc[n].s++;
  });
  return acc;
}
function attCapturado(){
  const por = attPorVendedor(); const t = {c:0,s:0};
  Object.keys(por).forEach(n=>{ t.c += por[n].c||0; t.s += por[n].s||0; });
  return t;
}
function attTotal(){
  const cap = attCapturado(), m = attManual();
  return { c: cap.c + (m.c||0), s: cap.s + (m.s||0) };
}
function attAdd(tipo){
  const m = attManual(); m[tipo] = (m[tipo]||0) + 1;
  localStorage.setItem(attKey(), JSON.stringify(m));
  render();
}
function attReset(){
  const m = attManual(); const n = (m.c||0)+(m.s||0);
  if(!n){ alert('No hay registros manuales que reiniciar.\n\nLas ventas capturadas en Captura de Series no se borran desde aquí.'); return; }
  if(!confirm('¿Borrar los '+n+' registro(s) manuales de hoy?\n\nLas ventas capturadas en la app NO se tocan.')) return;
  localStorage.removeItem(attKey());
  render();
}

const VENDEDORES_TB = (_cfg && Array.isArray(_cfg.vendedores) && _cfg.vendedores.length)
  ? _cfg.vendedores
  : [];
function nombreCorto(n){ const p=n.split(' '); return p[0]+(p[1]?' '+p[1][0]+'.':''); }
// Vendedores configurados + cualquiera que haya vendido hoy, ordenados por attach
function filasLeaderboard(){
  const por = attPorVendedor();
  const nombres = Array.from(new Set(VENDEDORES_TB.concat(Object.keys(por))));
  return nombres.map(v=>{
    const a = por[v] || {c:0,s:0};
    const t = a.c + a.s;
    return { vend:v, c:a.c, s:a.s, total:t, pct: t>0 ? Math.round(a.c/t*100) : null };
  }).sort((a,b)=>{
    if(a.pct===null && b.pct===null) return a.vend.localeCompare(b.vend);
    if(a.pct===null) return 1;
    if(b.pct===null) return -1;
    return b.pct - a.pct || b.total - a.total;
  });
}

function tieneExistencia_(sku){
  const inv = invBySku[sku];
  if(!inv) return false;
  return (inv.stock||0)>0 || (inv.exhibe||0)>0;
}

// Calcula el stock cerrado y la exhibición restante desde los datos crudos de
// la nube. Corre dentro de calcDerivados (no al cargar) para que respete el
// estado EOL aunque los datos de EOL lleguen después del inventario.
function finalizarStock(item){
  if(!item || item._onhand === undefined) return;   // sin datos de nube: conserva lo estático
  const o = item._onhand||0, e = item._exhibeRaw||0, v = item._vendido||0, ev = item._ev||0;
  item.stock = Math.max(0, o - v);                   // stock cerrado (almacén), sin exhibición
  // La exhibición solo la venden los productos EOL; ahí las ventas que exceden
  // el almacén la descuentan. Usa su propio corte (ev), que NO se reinicia con
  // el ON HAND diario, para que una pieza vendida no reaparezca al día siguiente.
  item.exhibe = eolSkuSet.has(item.sku) ? Math.max(0, e - Math.max(0, ev - o)) : e;
}
function calcDerivados(){
  (D.inventario||[]).forEach(finalizarStock);
  Object.keys(invBySku).forEach(function(sku){ finalizarStock(invBySku[sku]); });
  EOL = (D.eol||[]).map(e=>{
    const inv = invBySku[e.sku] || {};
    const stock = inv.stock||0, exhibe = inv.exhibe||0;
    const estado = (stock===0 && exhibe>0) ? 'listo' : (stock>0 ? 'pendiente' : 'agotado');
    const precio = e.precio || inv.precio || 0;
    return { sku:e.sku, producto:e.producto||inv.producto||('SKU '+e.sku),
      precio:precio, precio50:precio?precio/2:null, stock, exhibe, estado };
  }).filter(e=>e.exhibe>0 && !EOL_PAUSADOS.has(e.sku));
  eolMap = {}; EOL.forEach(e=>{ eolMap[e.sku]=e.estado; });
  transitoMap = {}; (D.transito||[]).forEach(x=>{ transitoMap[x.sku]=(transitoMap[x.sku]||0)+x.cantidad; });
  RESURTIR = (D.inventario||[]).filter(x=>x.stock===0 && x.exhibe>0 && !eolSkuSet.has(x.sku))
              .sort((a,b)=> a.producto.localeCompare(b.producto));
  AGOTADOS = (D.inventario||[]).filter(x=>(x.stock||0)===0 && (x.exhibe||0)===0 && !eolSkuSet.has(x.sku))
              .sort((a,b)=> a.producto.localeCompare(b.producto));
}
calcDerivados();

  if(id==='nov')   return (D.novedades||[]).filter(x=>coincide(x.titulo,x.detalle)).length;

// Precio de venta de un artículo DENTRO de un combo:
// EOL última pieza → 50% del regular; con promoción → precio promo; si no → regular.
function _promoDe(sku){ return PROMOS.find(p=>p.sku===sku); }
function _eolDe(sku){ return EOL.find(e=>e.sku===sku); }
function _eolRaw(sku){ return (D.eol||[]).find(e=>e.sku===sku); }
// Un EOL solo se vende al 50% cuando está "listo" (stock cerrado en 0 y con
// pieza de exhibición). Un EOL que todavía tiene stock (pendiente, ej. Pura 80)
// se vende a su precio NORMAL de promoción, NO al 50%.
function esVentaAl50(sku){
  const er=_eolRaw(sku);
  if(!er || !parseFloat(er.precio)) return false;
  const ea=(typeof EOL!=='undefined')?EOL.find(x=>x.sku===sku):null;
  if(ea) return ea.estado==='listo';
  // No está en el array calculado (exhibición 0 en datos locales): se considera
  // venta al 50% solo si ya no tiene stock cerrado NI promoción vigente.
  const inv=invBySku[sku]||{};
  return (inv.stock||0)===0 && !_promoDe(sku);
}
function precioVentaEnCombo(sku){
  const er=_eolRaw(sku);
  if(esVentaAl50(sku)) return {precio:(parseFloat(er.precio)||0)/2, nota:'−50% última pieza'};
  const p=_promoDe(sku);
  if(p){
    const v=parseFloat(String(p.pp||p.pr||0).replace(/[^0-9.]/g,''));
    if(v) return {precio:v, nota:(p.pp&&p.pr&&String(p.pp)!==String(p.pr))?'promo':''};
  }
  const inv=invBySku[sku];
  if(inv && inv.precio) return {precio:parseFloat(inv.precio)||0, nota:''};
  if(er && parseFloat(er.precio)) return {precio:parseFloat(er.precio)||0, nota:''};
  return {precio:0, nota:'sin precio'};
}
// Desglose completo del combo: cada artículo con su precio, mica, seguro y total.
function desgloseBundle(x){
  const skuArr=(x.skus||'').split(',').map(s=>s.trim()).filter(Boolean);
  const total=Number(x.precio)||0;
  let sub=0;
  const rows=skuArr.map(s=>{
    const {precio,nota}=precioVentaEnCombo(s);
    sub+=precio;
    const nombre=invBySku[s]?invBySku[s].producto:('SKU '+s);
    return `<div class="dg-row"><span>${nombre}${nota?` <em>${nota}</em>`:''}</span><b>${money2(precio)}</b></div>`;
  }).join('');
  let extras=total-sub;
  const tieneMica=/mica/i.test(x.nombre||'');
  let micaRow='';
  if(tieneMica){ micaRow=`<div class="dg-row"><span>Mica de hidrogel</span><b>${money2(149)}</b></div>`; extras-=149; }
  const segRow= extras>0.5 ? `<div class="dg-row dg-seg"><span>🛡️ Seguro incluido</span><b>${money2(extras)}</b></div>` : '';
  const rg=(x.nombre||'').match(/regalo:\s*([^)·]+)/i);
  const regaloLine= rg ? `<div class="dg-row dg-regalo"><span>🎁 Regalo: ${rg[1].trim()}</span><b>Incluido</b></div>` : '';
  return `<div class="bundle-desglose">
    ${rows}
    <div class="dg-row dg-sub"><span>Subtotal productos</span><b>${money2(sub)}</b></div>
    ${micaRow}
    ${segRow}
    ${regaloLine}
    <div class="dg-row dg-total"><span>Total combo</span><b>${money2(total)}</b></div>
  </div>`;
}

/* ================= Cola de llamadas al GAS =================
   Google Apps Script descarta las llamadas que llegan encimadas y lo hace EN
   SILENCIO (responde 200 sin ejecutar). Antes las 6 cargas salían todas en el
   mismo instante: unas llegaban y otras no, así que promos/combos/avisos se
   quedaban vacíos —y sus pestañas se ocultaban solas por seccionTieneItems()—
   sin que nadie se enterara. Ahora salen de una en una, espaciadas, con
   timeout, reintento y aviso visible si algo no llegó. */
const GAS_GAP        = 1500;    // ms de separación entre llamadas
const GAS_TIMEOUT    = 15000;   // ms de espera por respuesta
const GAS_REINTENTOS = 2;

let _gasCola = [], _gasCorriendo = false, _gasN = 0;
const espera = ms => new Promise(r=>setTimeout(r, ms));

function gasJsonp(qs){
  return new Promise(function(resolve, reject){
    // Callback único: Date.now() solo no basta, dos llamadas en el mismo
    // milisegundo se pisan y cruzan las respuestas (ya pasó en Captura de Series).
    const cb = '_gas' + Date.now() + '_' + (++_gasN);
    const sc = document.createElement('script');
    const t  = setTimeout(function(){ limpiar(); reject(new Error('timeout')); }, GAS_TIMEOUT);
    function limpiar(){ clearTimeout(t); delete window[cb]; sc.remove(); }
    window[cb] = function(d){ limpiar(); resolve(d); };
    sc.onerror = function(){ limpiar(); reject(new Error('red')); };
    sc.src = CLOUD_URL + '?' + qs + '&callback=' + cb
           + (GAS_TOKEN ? '&t=' + encodeURIComponent(GAS_TOKEN) : '');
    document.head.appendChild(sc);
  });
}

// prioritario:true → se cuela al frente (para escrituras: apartados, EOL)
function gasPedir(qs, opts){
  opts = opts || {};
  return new Promise(function(resolve, reject){
    const tarea = { qs, resolve, reject, intentos:0,
      max: opts.reintentos!=null ? opts.reintentos : GAS_REINTENTOS };
    if(opts.prioritario) _gasCola.unshift(tarea); else _gasCola.push(tarea);
    _gasBombear();
  });
}

async function _gasBombear(){
  if(_gasCorriendo) return;
  _gasCorriendo = true;
  while(_gasCola.length){
    const t = _gasCola.shift();
    try{
      t.resolve(await gasJsonp(t.qs));
    }catch(e){
      if(t.intentos < t.max){
        t.intentos++;
        _gasCola.unshift(t);                      // reintenta antes que el resto
        await espera(GAS_GAP * (t.intentos + 1)); // ...dándole más aire cada vez
        continue;
      }
      t.reject(e);
    }
    if(_gasCola.length) await espera(GAS_GAP);
  }
  _gasCorriendo = false;
}

/* ---- Estado de las cargas + aviso al usuario ---- */
const CARGAS = { inventario:'pendiente', eol:'pendiente', promos:'pendiente',
                 bundles:'pendiente', avisos:'pendiente', apartados:'pendiente' };
const CARGA_NOMBRE = { inventario:'inventario', eol:'EOL', promos:'promos',
                       bundles:'combos', avisos:'avisos', apartados:'apartados' };
function marcarCarga(k, ok){ CARGAS[k] = ok ? 'ok' : 'error'; actualizarBanner(); }

function actualizarBanner(){
  const w = document.getElementById('liveWarning');
  const t = document.getElementById('liveWarningTitulo');
  const m = document.getElementById('liveWarningMsg');
  if(!w || !t || !m) return;
  const btn = '<button class="lw-btn" onclick="reintentarCargas()">↻ Reintentar</button>';
  if(CARGAS.inventario === 'error'){
    w.className = 'visible err';
    t.textContent = 'Sin conexión al inventario';
    m.innerHTML = 'No se pudo confirmar el stock — <b>los números que ves pueden estar desactualizados</b>.<br>' + btn;
    return;
  }
  if(CARGAS.inventario === 'pendiente'){
    w.className = 'visible';
    t.textContent = 'Inventario sin confirmar';
    m.innerHTML = 'Conectando… no cotices piezas al cliente hasta ver <b style="color:var(--verde)">● en vivo</b> arriba';
    return;
  }
  const fallidas = Object.keys(CARGAS).filter(k=>CARGAS[k]==='error').map(k=>CARGA_NOMBRE[k]);
  if(fallidas.length){
    w.className = 'visible';
    t.textContent = 'Faltan datos por cargar';
    m.innerHTML = 'No cargó: <b>' + fallidas.join(', ') + '</b>. Esas pestañas pueden verse vacías o incompletas.<br>' + btn;
    return;
  }
  w.className = '';
}

function reintentarCargas(){
  const mapa = { inventario:cargarInventarioNube, eol:cargarEolNube, promos:cargarPromosNube,
                 bundles:cargarBundlesNube, avisos:cargarAvisosNube, apartados:cargarApartadosNube };
  Object.keys(CARGAS).forEach(function(k){
    if(CARGAS[k] === 'error'){ CARGAS[k] = 'pendiente'; mapa[k](); }
  });
  actualizarBanner();
}

/* ---- Antigüedad del inventario ----
   Con la PWA abierta varios días, "Live 09:12" del martes se ve idéntico al de
   hoy. Si la última confirmación no es de hoy, se dice con todas sus letras. */
let _invFecha = null;      // Date de la última confirmación de inventario
let _ultimaCarga = 0;      // ms de la última carga con éxito
let _ultimoIntento = 0;    // ms del último intento (con o sin éxito)

function pintarUpdated(){
  const el = document.getElementById('updated');
  if(!el) return;
  // Sin respuesta de la nube pero con inventario guardado: se muestra, diciendo
  // de cuándo es. Que nadie prometa una pieza creyendo que el dato es de hoy.
  if(!_invFecha && _invEdadHoras != null){
    const h = Math.round(_invEdadHoras);
    const txt = h < 1 ? 'hace un rato' : (h < 24 ? 'hace ' + h + ' h' : 'hace ' + Math.floor(h/24) + ' d');
    const color = _invEdadHoras <= INV_HORAS_OK ? 'var(--naranja)' : 'var(--rojo)';
    el.innerHTML = 'Guardado<b style="color:' + color + ';display:block;font-size:11px">● ' + txt + ' · confirma en sistema</b>';
    return;
  }
  if(!_invFecha) return;
  const t = _invFecha.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  if(hoyISO(_invFecha) === HOY_ISO){
    el.innerHTML = 'Live ' + t + '<b style="color:var(--verde);display:block;font-size:11px">● en vivo</b>';
  }else{
    const dia = _invFecha.toLocaleDateString('es-MX',{day:'numeric',month:'short'});
    el.innerHTML = dia + ' ' + t + '<b style="color:var(--naranja);display:block;font-size:11px">● no es de hoy</b>';
  }
}

/* ---- Aplicadores ----
   Separados de las funciones que piden los datos, porque la misma respuesta
   puede llegar por una llamada suelta (modo=inventario) o dentro del paquete
   completo (modo=todo). */
const _esObj = d => d && typeof d === 'object' && !Array.isArray(d);
/* Desde que el Apps Script exige token, un rechazo llega como
   {error:'no_autorizado'} — que TAMBIÉN es un objeto y pasaba _esObj. El
   tablero lo tomaba por datos buenos, se marcaba "en vivo" con todo en cero y
   pisaba el inventario guardado. */
const _esError = d => _esObj(d) && typeof d.error === 'string';
const _datosUtiles = d => _esObj(d) && !_esError(d) && Object.keys(d).length > 0;

function aplicarInventario(data){
  (function(data){
    // Guarda los datos crudos de la nube; el stock cerrado y la exhibición
    // restante se calculan en calcDerivados (finalizarStock), que corre también
    // cuando llegan los datos de EOL.
    function rawFields(cl){
      return {
        _onhand:    cl.o || 0,
        _vendido:   cl.v || 0,
        _exhibeRaw: (typeof cl.e === 'number') ? cl.e : 0,
        _ev:        cl.ev || 0
      };
    }
    (D.inventario||[]).forEach(function(item){
      const cl = data[item.sku];
      if(cl && typeof cl.o === 'number'){
        Object.assign(item, rawFields(cl));
        if(cl.p && !item.precio) item.precio = parseFloat(String(cl.p).replace(/[^0-9.]/g,''))||0;
      }
    });
    // Agrega al inventario local los SKUs que el GAS conoce (Catalogo o Catalogo_ref)
    // pero que no están en datos.js — esto incluye productos agotados que ya no vienen
    // en el Excel de Sonar pero el GAS los conserva vía Catalogo_ref
    const skusLocales = new Set((D.inventario||[]).map(function(x){ return x.sku; }));
    Object.keys(data).forEach(function(sku){
      if(skusLocales.has(sku)) return;
      const cl = data[sku];
      if(!cl || !cl.d) return; // sin descripción → SKU vacío, ignorar
      const item = Object.assign({
        sku: sku,
        producto: cl.d,
        precio:   parseFloat(String(cl.p||'').replace(/[^0-9.]/g,''))||0
      }, rawFields(cl));
      if(!D.inventario) D.inventario = [];
      D.inventario.push(item);
      invBySku[sku] = item;
    });
    // Actualiza invBySku para SKUs EOL que no están en D.inventario
    (D.eol||[]).forEach(function(e){
      if(invBySku[e.sku]) return;
      const cl = data[e.sku];
      if(!cl) return;
      invBySku[e.sku] = Object.assign({
        sku: e.sku, producto: cl.d||'',
        precio: parseFloat(String(cl.p||'').replace(/[^0-9.]/g,''))||0
      }, rawFields(cl));
    });
    D._invCloud = true;
    _invFecha = new Date();
    _ultimaCarga = Date.now();
    guardarInvCache();   // para que sirva sin red la próxima vez
    pintarUpdated();
  })(data);
}

function aplicarEol(data){
  const skusLocales = new Set((D.eol||[]).map(function(e){ return e.sku; }));
  data.forEach(function(e){
    if(skusLocales.has(e.sku)) return;
    // SKU subido via admin (ADENDUM PDF) que no estaba en datos.js
    (D.eol = D.eol||[]).push({ sku: e.sku, precio: parseFloat(e.precio)||0 });
    eolSkuSet.add(e.sku);
  });
}

function aplicarPromos(data){
  const todas = Object.keys(data).map(function(sku){
    const p = data[sku] || {};
    const inv = invBySku[sku];
    return { sku:sku, producto:p.d||(inv && inv.producto)||('SKU '+sku),
      pr:(p.pr!=null?p.pr:null), pp:(p.pp!=null?p.pp:null), d1:p.d1||null, d2:p.d2||null };
  });
  // Se cachea la lista COMPLETA (no la filtrada): así, al cambiar el día, las
  // vigencias se recalculan desde el caché aunque el celular esté sin red.
  try{ localStorage.setItem(PROMOS_KEY, JSON.stringify(todas)); }catch(e){}   // cuota llena: se sigue con lo que hay en memoria
  PROMOS = todas.filter(vigenteHoy)
                .sort(function(a,b){ return a.producto.localeCompare(b.producto); });
}

function aplicarBundles(data){
  try{ localStorage.setItem(BUNDLES_KEY, JSON.stringify(data)); }catch(e){}   // cuota llena: se sigue con lo que hay en memoria
  BUNDLES = data.filter(vigenteHoy);
}

/* Vuelve a filtrar promos y combos desde el caché — para cuando cambió el día
   sin que haya habido una carga nueva de la nube. */
function refiltrarCaches(){
  try{
    const c = JSON.parse(localStorage.getItem(PROMOS_KEY)||'null');
    if(Array.isArray(c)) PROMOS = c.filter(vigenteHoy)
      .sort(function(a,b){ return a.producto.localeCompare(b.producto); });
  }catch(e){}   // si el cache no se puede releer, quedan las promos ya filtradas
  try{
    const b = JSON.parse(localStorage.getItem(BUNDLES_KEY)||'null');
    if(Array.isArray(b)) BUNDLES = b.filter(vigenteHoy);
  }catch(e){}   // idem: quedan los combos ya filtrados
}

function aplicarAvisos(data){
  const locales = new Set((D.avisos||[]).map(function(a){ return a.titulo; }));
  data.forEach(function(a){
    if(locales.has(a.titulo)) return;
    (D.avisos = D.avisos||[]).unshift(a);
  });
}

// Devuelve false si la respuesta no trae el formato esperado (GAS sin el modo)
function aplicarVentas(data){
  if(!_esObj(data) || !_esObj(data.vend)) return false;
  const acc = {};
  Object.keys(data.vend).forEach(function(n){
    const v = data.vend[n] || {};
    acc[n] = { c:Number(v.c)||0, s:Number(v.s)||0 };
  });
  VENTAS_NUBE = acc;
  VENTAS_NUBE_HORA = 'actualizado ' + new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  return true;
}

/* ---- Cargas sueltas (respaldo si no hay modo=todo) ---- */
async function cargarInventarioNube(){
  let data;
  try{
    data = await gasPedir('modo=inventario');
    if(_esError(data))      throw new Error('rechazado: ' + data.error);
    if(!_datosUtiles(data)) throw new Error('respuesta inválida');
  }catch(e){
    marcarCarga('inventario', false);
    // Si hay inventario guardado seguimos mostrándolo (con su edad); solo
    // cuando no hay nada se anuncia que no hay conexión.
    if(_invEdadHoras != null){ pintarUpdated(); return; }
    const el = document.getElementById('updated');
    if(el) el.innerHTML = '<span style="color:var(--rojo);font-weight:700">Sin conexión</span>';
    return;
  }
  aplicarInventario(data);
  calcDerivados();
  render();
  marcarCarga('inventario', true);
}

  let data;

    data = await gasPedir('modo=eol_cloud');
    if(!Array.isArray(data)) throw new Error('respuesta inválida');
  }catch(e){ marcarCarga('eol', false); return; }
  aplicarEol(data);
  calcDerivados();
  render();
  marcarCarga('eol', true);

const SB_URL = 'https://rjdrljtujbwooejrpyqv.supabase.co';
const SB_KEY = 'sb_publishable_mELjDmCaFpNOxcwPi5MB2A_qSZ5ZA2z';

async function sbRpc(fn, ms){
  const ctl = new AbortController();
  const t = setTimeout(function(){ ctl.abort(); }, ms || 8000);
  try{
    const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method:'POST', signal: ctl.signal,

      body: JSON.stringify({ p_store: String(TIENDA_ID || '') })
    });

/* Supabase → la forma que ya consumen aplicarInventario, aplicarPromos, etc. */

  const inv = {};
  (d.inventario||[]).forEach(function(x){
    inv[x.sku] = { d:x.descripcion, o:x.onhand, v:x.vendido,
                   e:x.exhibicion, ev:x.exh_vendida, p:x.precio };
  });
  const pro = {};
  (d.promos||[]).forEach(function(p){
    pro[p.sku] = { d:p.producto, pr:p.precio_reg, pp:p.precio_pro,
                   est:p.estatus, msi:p.msi, d1:p.vigente_desde, d2:p.vigente_hasta };
  });
  const vend = {};
  (d.ventas_hoy||[]).forEach(function(v){
    vend[v.vendedor] = { c:Number(v.con_seguro)||0, s:Number(v.sin_seguro)||0 };
  });
  return {
    inventario: inv,
    promos: pro,
    eol: (d.eol||[]).map(function(e){
      return { sku:e.sku, precio: e.precio!=null ? e.precio : e.precio_efectivo }; }),
    bundles: (d.bundles||[]).map(function(b){
      return { id:String(b.id), nombre:b.nombre,
               // en Supabase skus es un array de verdad; aquí se espera "a,b,c"
               skus: Array.isArray(b.skus) ? b.skus.join(',') : String(b.skus||''),
               precio:b.precio, d1:b.vigente_desde, d2:b.vigente_hasta }; }),
    avisos: (d.avisos||[]).map(function(a){
      return { id:String(a.id), titulo:a.titulo, detalle:a.detalle||'',
               fecha: a.creado_en ? String(a.creado_en).slice(0,10) : '',
               d2:a.vigente_hasta, prioridad:a.prioridad||'normal', tipo:'manual' }; }),
    apartados: (d.apartados||[]).map(function(a){
      // `transaccion` es el ticket del POS: el enlace entre el apartado y la
      // venta. Si se cae de aquí, se pierde sin que nada avise.
      return { id:String(a.id), sku:a.sku, color:a.color||'', cliente:a.cliente,
               telefono:a.telefono||'', precio: a.precio!=null ? String(a.precio) : '',
               seguro: a.con_seguro ? 'Si' : '', vend:a.vendedor||'',
               estatus:a.estatus||'Apartado', transaccion:a.transaccion||'',
               fecha: a.creado_en ? String(a.creado_en).slice(0,16).replace('T',' ') : '' }; }),
    ventas_hoy: { vend: vend }
  };
}

async function cargarTodoSupabase(){
  const bruto = await sbRpc('tablero_todo');
  // Se revisa la FORMA, no solo que llegue: una respuesta rara vale menos que
  // ninguna, porque pintaría un tablero vacío como si fuera bueno.
  if(!_esObj(bruto) || !Array.isArray(bruto.inventario) || !bruto.inventario.length) return false;
  return aplicarTodo(_deSupabase(bruto));
}

/* Todo en un solo viaje (~4 s contra ~20 s de las seis llamadas). Si este GAS
   no tiene el modo, contesta con la lista de ventas —su else final— así que hay
   que revisar la FORMA de lo que llega, no solo que llegue. */
async function cargarTodoNube(){
  let d;
  try{
    d = await gasPedir('modo=todo', { reintentos:1 });
    if(!_esObj(d) || !_esObj(d.inventario)) throw new Error('sin modo=todo');
  }catch(e){ return false; }
  return aplicarTodo(d);
}

/* Lo comparten las dos rutas a propósito: el que pinta el stock es el mismo
   código venga de donde venga el dato. Si se duplicara, tarde o temprano una
   de las dos ramas se quedaría atrás y el tablero mostraría cosas distintas
   según qué nube haya contestado. */
function aplicarTodo(d){
  aplicarInventario(d.inventario);                             marcarCarga('inventario', true);
  if(Array.isArray(d.eol))       { aplicarEol(d.eol);          marcarCarga('eol', true); }
  if(_esObj(d.promos))           { aplicarPromos(d.promos);    marcarCarga('promos', true); }
  if(Array.isArray(d.bundles))   { aplicarBundles(d.bundles);  marcarCarga('bundles', true); }
  if(Array.isArray(d.avisos))    { aplicarAvisos(d.avisos);    marcarCarga('avisos', true); }
  if(Array.isArray(d.apartados)) { APARTADOS = d.apartados;    marcarCarga('apartados', true); }
  aplicarVentas(d.ventas_hoy);
  calcDerivados();
  render();
  return true;
}

let _refrescando = false;
async function refrescarNube(){
  if(_refrescando) return;
  _refrescando = true;
  _ultimoIntento = Date.now();
  try{
    // 1º Supabase: un viaje y sin cola. 2º el Apps Script, que sigue vivo y
    // sirve de red mientras dure la migración. 3º las sueltas.
    if(await cargarTodoSupabase()) return;
    if(await cargarTodoNube()) return;
    // Respaldo: de una en una y espaciadas, porque juntas se pierden en silencio.
    // Orden por criticidad: primero lo que decide un precio o un cupo frente al
    // cliente (stock, 50% de EOL, apartados de preventa); los avisos y el
    // leaderboard pueden esperar.
    cargarInventarioNube();
    cargarEolNube();
    cargarApartadosNube();
    cargarPromosNube();
    cargarBundlesNube();
    cargarAvisosNube();
    cargarVentasNube();
  } finally { _refrescando = false; }
}

render();
actualizarBanner();
refrescarNube();

/* ---- Al volver a la app ----
   El asesor deja la PWA abierta y regresa horas (o días) después: sin esto ve
   el stock, las vigencias y el leaderboard del momento en que la abrió. */
const REFRESCO_MS = 5*60*1000;   // datos más viejos que esto se vuelven a pedir
const ESPERA_MIN_MS = 30*1000;   // ...pero nunca dos viajes al GAS tan seguidos

function alVolver(){
  if(document.visibilityState !== 'visible') return;
  const cambioDia = tocarDia();
  if(cambioDia){
    refiltrarCaches();   // vigencias al día aunque no haya red
    pintarUpdated();
    render();
  }
  if(Date.now() - _ultimoIntento < ESPERA_MIN_MS) return;
  if(cambioDia || Date.now() - _ultimaCarga > REFRESCO_MS) refrescarNube();
}
document.addEventListener('visibilitychange', alVolver);
window.addEventListener('focus', alVolver);
window.addEventListener('online', function(){ _ultimoIntento = 0; alVolver(); });

// ── Push notifications (OneSignal) ──────────────────────────────
const ONE_APP_ID = 'db32a1ef-d484-4be3-adfc-2a9e17f7e4f1';

function actualizarCampana(){
  const btn=document.getElementById('btnBell');
  if(!btn) return;
  const p=('Notification' in window)?Notification.permission:'default';
  btn.style.color = p==='granted'?'var(--rojo)':'#ddd';
  btn.title = p==='granted'?'Avisos push activados':'Activar avisos push';
}

async function activarNotifs(){
  if(ONE_APP_ID==='TU_APP_ID_AQUI'){
    alert('⚠️ El admin aún no configuró las notificaciones push.'); return;
  }
  if(!('Notification' in window)){ alert('Tu navegador no soporta notificaciones.'); return; }
  if(Notification.permission==='granted'){
    alert('Ya tienes las notificaciones activadas ✓'); return;
  }
  if(typeof OneSignal==='undefined'){ alert('Cargando SDK… intenta de nuevo.'); return; }
  try{
    await OneSignal.Notifications.requestPermission();
    actualizarCampana();
  }catch(e){ console.warn('Push error',e); }
}

window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal){
  if(ONE_APP_ID==='TU_APP_ID_AQUI') return;
  await OneSignal.init({
    appId: ONE_APP_ID,
    serviceWorkerPath: 'sw.js',
    serviceWorkerParam: { scope: '/' },
    notifyButton: { enable: false }
  });
  actualizarCampana();
});

actualizarCampana();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).catch(()=>{});
}
